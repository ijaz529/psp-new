global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: "vault"
    static_configs:
      - targets: ["vault:8081"]
    metrics_path: /metrics

  - job_name: "acquirer-host"
    static_configs:
      - targets: ["acquirer-host:8082"]
    metrics_path: /metrics

  - job_name: "scheme-simulator"
    static_configs:
      - targets: ["scheme-simulator:9002"]
    metrics_path: /metrics

  - job_name: "outbox-relay"
    static_configs:
      - targets: ["outbox-relay:8083"]
    metrics_path: /metrics

  - job_name: "worker"
    static_configs:
      - targets: ["worker:8084"]
    metrics_path: /metrics

  - job_name: "portal"
    static_configs:
      - targets: ["portal:3000"]
    metrics_path: /metrics

  - job_name: "checkout"
    static_configs:
      - targets: ["checkout:7001"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]   # prometheus exporter (OTel metrics)
      - targets: ["otel-collector:8888"]   # collector self-metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
