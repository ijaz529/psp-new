version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels: ["deps"]
    groups:
      otel:
        patterns:
          - "@opentelemetry/*"
      dev-tools:
        patterns:
          - "@biomejs/biome"
          - "turbo"
          - "vitest"
          - "tsx"
          - "typescript"
          - "drizzle-kit"
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
          - "fastify-*"

  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    labels: ["deps", "docker"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["deps", "ci"]
